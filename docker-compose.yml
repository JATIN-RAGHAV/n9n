services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 4s
      retries: 3
    mem_limit: 128m
    pids_limit: 100
    stop_grace_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Start only after the local database accepts connections. When
    # DATABASE_URL points at an external database, this still waits for the
    # bundled postgres service, which is harmless.
    depends_on:
      postgres:
        condition: service_healthy
      secrets:
        condition: service_completed_successfully
    # Uses ENCRYPTION_KEY and RUNNER_TOKEN from .env when set; otherwise the
    # keys the secrets service generated for this machine.
    entrypoint: ["/bin/sh", "-c", ". /secrets/env && export ENCRYPTION_KEY=\"$${ENCRYPTION_KEY:-$$GEN_ENCRYPTION_KEY}\" RUNNER_TOKEN=\"$${RUNNER_TOKEN:-$$GEN_RUNNER_TOKEN}\" && exec \"$$@\"", "--"]
    command: ["/usr/local/bin/n9n-backend"]
    volumes:
      - secrets:/secrets:ro
    environment:
      ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://n9n:n9n_local_dev@postgres:5432/n9n?sslmode=disable}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/oauth/google/callback}
      RUN_RETENTION_DAYS: ${RUN_RETENTION_DAYS:-30}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    # Same key source as the backend, so both always share one RUNNER_TOKEN.
    entrypoint: ["/bin/sh", "-c", ". /secrets/env && export RUNNER_TOKEN=\"$${RUNNER_TOKEN:-$$GEN_RUNNER_TOKEN}\" && exec \"$$@\"", "--"]
    command: ["/usr/local/bin/n9n-runner"]
    volumes:
      - secrets:/secrets:ro
    environment:
      BACKEND_URL: http://backend:8080
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_ID: ${RUNNER_ID:-runner-1}
      RUNNER_POLL_MS: ${RUNNER_POLL_MS:-1000}
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-4}
      ALLOW_PRIVATE_HTTP: ${ALLOW_PRIVATE_HTTP:-false}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "n9n-runner", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: n9n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n9n_local_dev}
      POSTGRES_DB: n9n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n9n -d n9n"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped

  # Runs once at startup. On the first run it creates random ENCRYPTION_KEY and
  # RUNNER_TOKEN values in the `secrets` volume, so no .env is needed. Later runs
  # keep them: deleting the volume makes saved credentials unreadable.
  secrets:
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        set -e
        f=/secrets/env
        [ -s "$$f" ] && exit 0
        hex() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        printf 'GEN_ENCRYPTION_KEY=%s\nGEN_RUNNER_TOKEN=%s\n' "$$(hex)" "$$(hex)" > "$$f.tmp"
        chmod 644 "$$f.tmp"
        mv "$$f.tmp" "$$f"
    volumes:
      - secrets:/secrets
    restart: "no"

volumes:
  postgres_data:
  secrets:
