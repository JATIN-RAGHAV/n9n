name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: n9n
          POSTGRES_PASSWORD: n9n_test
          POSTGRES_DB: n9n_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n9n -d n9n_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://n9n:n9n_test@localhost:5432/n9n_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
      - run: cargo fmt --check
        working-directory: runner
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: runner
      - run: cargo test
        working-directory: runner

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: web
      - run: flutter analyze
        working-directory: web
      - run: flutter test
        working-directory: web
      - run: flutter build web --wasm --release
        working-directory: web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run export:android
        working-directory: mobile
      - run: npm run export:ios
        working-directory: mobile

  contract-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@1.34.3 lint contracts/openapi.yaml
      - run: docker compose --env-file .env.example config --quiet

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: python3 tests/e2e_smoke.py
      - run: python3 tests/mobile_api_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test -- --workers=1
        working-directory: tests/browser
      - if: always()
        run: docker compose down --volumes
